<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Starfall Skiff — catch the falling stars</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    background: #070818;
    cursor: crosshair;
    image-rendering: auto;
  }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: #5b6b8c; font-size: 12px; letter-spacing: .04em;
    user-select: none; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="960" height="600"></canvas></div>
  <div id="hint">WASD / arrows or mouse to fly &nbsp;·&nbsp; Space / click to fire &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
